name: Build/release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            architecture: x64
            ffmpeg_platform: win32-x64
          - os: ubuntu-latest
            platform: Linux
            architecture: x64
            ffmpeg_platform: linux-x64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'false'
          lfs: 'false'

      - name: Check out hoshidicts
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive vendor/hoshidicts

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        shell: bash
        run: |
          pnpm rebuild electron
          node -e "const fs = require('node:fs'); const electron = require('electron'); if (!fs.existsSync(electron)) throw new Error('Electron runtime was not installed: ' + electron)"

      - name: Validate runner architecture
        shell: bash
        run: node -e "if (process.arch !== '${{ matrix.architecture }}') throw new Error('Expected ${{ matrix.architecture }}, received ' + process.arch)"

      - name: Validate release configuration
        shell: bash
        env:
          MAIN_VITE_INTERFACE_URL: ${{ vars.HAYATAN_INTERFACE_URL }}
        run: |
          if [ -z "$MAIN_VITE_INTERFACE_URL" ]; then
            echo "Set the HAYATAN_INTERFACE_URL repository variable before releasing."
            exit 1
          fi

      - name: Download minimal FFmpeg sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FFMPEG_PLATFORM: ${{ matrix.ffmpeg_platform }}
        run: |
          set -euo pipefail
          release_tag=$(tr -d '\r\n' < native/ffmpeg-build/release-tag.txt)
          download_directory="$RUNNER_TEMP/hayatan-ffmpeg-release"
          mkdir -p "$download_directory"

          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$download_directory" \
            --pattern SHA256SUMS \
            --pattern "*-$FFMPEG_PLATFORM*"

          node scripts/install-ffmpeg-release.mjs "$download_directory" "$FFMPEG_PLATFORM"

      - name: Build and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_VITE_INTERFACE_URL: ${{ vars.HAYATAN_INTERFACE_URL }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:publish
